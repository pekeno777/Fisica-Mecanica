            container.innerHTML = `
                <div>
                    <span class="text-xs font-semibold tracking-widest uppercase accent-text block mb-1">${slide.subtitle}</span>
                    <h2 class="text-lg md:text-xl font-bold text-white leading-tight">${slide.title}</h2>
                </div>
                <div class="my-auto py-2">
                    ${slide.content}
                </div>
            `;

            document.getElementById('slide-counter').innerText = `Diapositiva ${currentSlide + 1} / ${slides.length}`;
            
            document.getElementById('prev-btn').disabled = currentSlide === 0;
            document.getElementById('next-btn').disabled = currentSlide === slides.length - 1;

            renderDots();

            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        function renderDots() {
            const dotsContainer = document.getElementById('dots-container');
            dotsContainer.innerHTML = '';
            slides.forEach((_, idx) => {
                const dot = document.createElement('button');
                dot.className = `w-2.5 h-2.5 rounded-full transition-all cursor-pointer ${idx === currentSlide ? 'accent-bg w-6' : 'bg-slate-700 hover:bg-slate-500'}`;
                dot.onclick = () => goToSlide(idx);
                dotsContainer.appendChild(dot);
            });
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        function goToSlide(index) {
            currentSlide = index;
            renderSlide();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
        });

        window.onload = function() {
            renderSlide();
        };
    </script>
</body>
</html>
